<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Quarantine Tracker</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#1f2a22;--muted:#6c786f;--line:#dfe6df;--accent:#385a43;--ok:#2f7a4d;--warn:#9a6a14;--danger:#a33a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1550px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;flex-wrap:wrap}h1{margin:0;font-size:30px}.sub,.small{color:var(--muted)}button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;font-weight:650;cursor:pointer}.primary{background:var(--accent);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{display:block;font-size:24px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.controls input{flex:1;min-width:220px}.controls input,.controls select,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1560px}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}th{background:#f8faf8;font-size:12px;text-transform:uppercase;color:#536158;position:sticky;top:0}td input,td select,td textarea{width:100%}textarea{min-height:58px;resize:vertical}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:12px;font-weight:700}.low,.cleared,.ready{background:#e7f4eb;color:var(--ok)}.medium,.observation,.intake,.recovery,.counting{background:#fff4d9;color:var(--warn)}.high,.treating,.blocked{background:#fde7e7;color:var(--danger)}.thumb{width:72px;height:72px;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:#eef2ee}.save{font-size:12px;color:var(--muted);margin-left:6px}.danger{color:var(--danger)}.count{font-size:18px;font-weight:800}.count small{display:block;font-size:11px;font-weight:600;color:var(--muted)}dialog{border:0;border-radius:14px;width:min(660px,calc(100% - 24px));box-shadow:0 20px 60px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:650}dialog input,dialog select,dialog textarea{width:100%;margin-top:3px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>🌿 Plant Quarantine Tracker</h1><div class="sub">Live quarantine countdown — treatment resets the release clock automatically.</div></div><div><button class="primary" id="openAdd">+ Add plant</button><button id="exportBtn">Export backup</button><span id="saveState" class="save">Loading…</span></div></header>
<section class="stats"><div class="stat"><b id="sTotal">0</b><span>Total</span></div><div class="stat"><b id="sActive">0</b><span>Still quarantined</span></div><div class="stat"><b id="sTreat">0</b><span>Treatment / watch</span></div><div class="stat"><b id="sClear">0</b><span>Ready / cleared</span></div></section>
<div class="controls"><input id="search" placeholder="Search plants, pests, notes…"><select id="filterStatus"><option value="">All statuses</option><option>Intake</option><option>Observation</option><option>Treating</option><option>Recovery</option><option>Cleared</option></select><select id="filterRisk"><option value="">All risks</option><option>Low</option><option>Medium</option><option>High</option></select></div>
<div class="tablewrap"><table><thead><tr><th>Photo</th><th>Plant</th><th>Intake</th><th>Status</th><th>Risk</th><th>Protocol</th><th>Symptoms / pests</th><th>Last treatment</th><th>Next check</th><th>Release countdown</th><th>Notes</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>
<dialog id="dlg"><form id="form"><h2>Add quarantine plant</h2><div class="grid"><label>Plant name<input name="name" required></label><label>Nickname<input name="nickname"></label><label>Intake<input name="intake" type="date" required></label><label>Status<select name="status"><option>Intake</option><option selected>Observation</option><option>Treating</option><option>Recovery</option><option>Cleared</option></select></label><label>Risk<select name="risk"><option>Low</option><option selected>Medium</option><option>High</option></select></label><label>Price<input name="price"></label><label>Countdown protocol<select name="treatmentProtocol"><option selected>Observation</option><option>Preventive treatment</option><option>Pest treatment</option></select></label><label>Last treatment<input name="lastTreatment" type="date"></label><label class="full">Symptoms / pest concerns<input name="symptoms"></label><label>Next check<input name="nextCheck" type="date"></label><label class="full">Notes<textarea name="notes"></textarea></label></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button type="button" id="cancelBtn">Cancel</button><button class="primary">Add</button></div></form></dialog>
<script>
const API_BASE='https://twemhhiyywhogaxvlnwz.supabase.co/functions/v1/quarantine-tracker';
const params=new URLSearchParams(location.search),token=params.get('token')||'',api=API_BASE+'?api=data&token='+encodeURIComponent(token);
let plants=[],timer;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function state(t){$('saveState').textContent=t}function protocol(p){return p.treatmentProtocol||((p.status==='Treating'||p.status==='Recovery')?'Pest treatment':'Observation')}
function releaseInfo(p){if(p.status==='Cleared')return{kind:'ready',text:'Ready',sub:'Manually cleared'};const pr=protocol(p);let base=p.intake,span=14;if(pr==='Preventive treatment'){base=p.lastTreatment||p.intake;span=14}if(pr==='Pest treatment'){if(!p.lastTreatment)return{kind:'blocked',text:'—',sub:'Set treatment date'};base=p.lastTreatment;span=21}if(!base)return{kind:'blocked',text:'—',sub:'Set intake date'};const target=new Date(base+'T12:00:00');target.setDate(target.getDate()+span);const now=new Date();now.setHours(12,0,0,0);const n=Math.ceil((target-now)/86400000);return n<=0?{kind:'ready',text:'Ready',sub:'Eligible '+target.toLocaleDateString()}:{kind:'counting',text:n+' day'+(n===1?'':'s'),sub:'Until '+target.toLocaleDateString()}}
async function load(){if(!token){state('Missing access token');return}const r=await fetch(api);if(!r.ok){state('Unable to load');return}plants=await r.json();render();state('Saved')}function save(){state('Saving…');clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(plants)});state(r.ok?'Saved '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Save failed')}catch{state('Save failed')}},250)}
function badge(v){return '<span class="badge '+String(v).toLowerCase()+'">'+esc(v)+'</span>'}
function render(){const q=$('search').value.toLowerCase(),fs=$('filterStatus').value,fr=$('filterRisk').value;const rows=plants.filter(p=>(!q||((p.name||'')+' '+(p.nickname||'')+' '+(p.symptoms||'')+' '+(p.notes||'')).toLowerCase().includes(q))&&(!fs||p.status===fs)&&(!fr||p.risk===fr));$('tbody').innerHTML=rows.map(p=>{const ri=releaseInfo(p),pr=protocol(p);return `<tr data-id="${esc(p.id)}"><td>${p.photo?`<img class="thumb" src="${esc(p.photo)}">`:'<div class="thumb" style="display:grid;place-items:center;color:#879288">no photo</div>'}<label class="small" style="cursor:pointer">Photo<input hidden class="photoInput" type="file" accept="image/*"></label></td><td style="min-width:190px"><input data-k="name" value="${esc(p.name)}"><input data-k="nickname" style="margin-top:5px" placeholder="nickname" value="${esc(p.nickname)}"><input data-k="price" style="margin-top:5px" placeholder="price" value="${esc(p.price)}"></td><td><input data-k="intake" type="date" value="${esc(p.intake)}"></td><td>${badge(p.status)}<select data-k="status" style="margin-top:5px">${['Intake','Observation','Treating','Recovery','Cleared'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${badge(p.risk)}<select data-k="risk" style="margin-top:5px">${['Low','Medium','High'].map(x=>`<option ${x===p.risk?'selected':''}>${x}</option>`).join('')}</select></td><td style="min-width:170px"><select data-k="treatmentProtocol">${['Observation','Preventive treatment','Pest treatment'].map(x=>`<option ${x===pr?'selected':''}>${x}</option>`).join('')}</select><div class="small" style="margin-top:5px">${pr==='Pest treatment'?'21 days after last treatment':pr==='Preventive treatment'?'14 days after last treatment':'14 days from intake'}</div></td><td style="min-width:220px"><textarea data-k="symptoms">${esc(p.symptoms)}</textarea></td><td><input data-k="lastTreatment" type="date" value="${esc(p.lastTreatment)}"></td><td><input data-k="nextCheck" type="date" value="${esc(p.nextCheck)}"></td><td style="min-width:145px"><div class="badge ${ri.kind}"><span class="count">${ri.text}</span><small>${esc(ri.sub)}</small></div></td><td style="min-width:250px"><textarea data-k="notes">${esc(p.notes)}</textarea></td><td><button class="danger deleteBtn">Delete</button></td></tr>`}).join('');const ready=plants.filter(p=>releaseInfo(p).kind==='ready').length;$('sTotal').textContent=plants.length;$('sActive').textContent=plants.length-ready;$('sTreat').textContent=plants.filter(p=>['Treating','Observation','Recovery'].includes(p.status)).length;$('sClear').textContent=ready}
$('tbody').addEventListener('change',e=>{const el=e.target,tr=el.closest('tr');if(!tr)return;const p=plants.find(x=>x.id===tr.dataset.id);if(!p)return;if(el.classList.contains('photoInput')){const f=el.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{p.photo=rd.result;render();save()};rd.readAsDataURL(f);return}const k=el.dataset.k;if(k){p[k]=el.value;render();save()}});$('tbody').addEventListener('click',e=>{const b=e.target.closest('.deleteBtn');if(!b)return;const tr=b.closest('tr');if(confirm('Remove this plant?')){plants=plants.filter(x=>x.id!==tr.dataset.id);render();save()}});
$('openAdd').onclick=()=>{form.reset();form.intake.value=new Date().toISOString().slice(0,10);dlg.showModal()};$('cancelBtn').onclick=()=>dlg.close();$('form').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));plants.push({id:uid(),name:d.name,nickname:d.nickname,intake:d.intake,status:d.status,risk:d.risk,price:d.price,treatmentProtocol:d.treatmentProtocol,symptoms:d.symptoms,lastTreatment:d.lastTreatment,nextCheck:d.nextCheck,notes:d.notes,photo:''});dlg.close();render();save()});$('search').addEventListener('input',render);$('filterStatus').addEventListener('change',render);$('filterRisk').addEventListener('change',render);$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(plants,null,2)],{type:'application/json'}));a.download='quarantine-tracker-backup.json';a.click()};load();
</script>
</body></html>
