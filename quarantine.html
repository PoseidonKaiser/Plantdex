<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaiser's Plant Onboarding Tracker</title><style>:root{--bg:#08100c;--card:#111b15;--card2:#16231b;--ink:#e7f2ea;--muted:#93a69a;--line:#2a3b31;--green:#58a978;--green2:#183827;--accent:#79c997;--ok:#78d49a;--warn:#f0b85a;--danger:#f08080;--shadow:0 16px 38px rgba(0,0,0,.34)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 5% 0%,#14281b 0,transparent 28%),radial-gradient(circle at 95% 0%,#102219 0,transparent 25%),var(--bg);min-height:100vh}.wrap{max-width:1550px;margin:auto;padding:34px 22px 60px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}h1{margin:0;font-size:clamp(2rem,4vw,3.4rem);letter-spacing:-.04em}.sub,.small{color:var(--muted)}button{border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:11px 15px;border-radius:12px;font-weight:700;cursor:pointer;font-size:.95rem;transition:.18s ease}button:hover{transform:translateY(-1px);border-color:#456252}.primary{background:#2f7650;border-color:#3f8b62;color:#fff}.topactions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.plantdex{background:#17271e}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:linear-gradient(180deg,#142019,#101913);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.stat b{display:block;font-size:2rem;font-weight:850}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.controls input{flex:1;min-width:220px}.controls input,.controls select,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#0d1711;color:var(--ink);outline:none;color-scheme:dark}.controls input:focus,.controls select:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(121,201,151,.13)}input::placeholder,textarea::placeholder{color:#708178}.tablewrap{background:#0e1711;border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;min-width:1560px}th,td{border-bottom:1px solid var(--line);padding:13px 12px;text-align:left;vertical-align:top}th{background:#17231b;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:#9fb3a5;position:sticky;top:0}tr:hover td{background:#111d16}td input,td select,td textarea{width:100%}textarea{min-height:58px;resize:vertical}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:.8rem;font-weight:750}.low,.cleared,.ready{background:#163b26;color:#8be0aa}.medium,.observation,.intake,.recovery,.counting{background:#463514;color:#f4c66d}.high,.treating,.blocked{background:#492020;color:#ff9b9b}.linked{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#173a28;color:#8adbaa;font-size:11px;font-weight:800}.thumb{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#101a14}.save{font-size:12px;color:var(--muted);margin-left:2px}.danger{background:#35191b;color:#ff9b9b;border-color:#5a292d}.count{font-size:18px;font-weight:800}.count small{display:block;font-size:11px;font-weight:600;color:inherit;opacity:.85}dialog{border:1px solid var(--line);background:#111b15;color:var(--ink);border-radius:22px;width:min(660px,calc(100% - 24px));box-shadow:0 25px 80px rgba(0,0,0,.55)}dialog::backdrop{background:rgba(2,7,4,.76);backdrop-filter:blur(3px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{font-size:.85rem;color:#a7b9ad;font-weight:750}dialog input,dialog select,dialog textarea{width:100%;margin-top:6px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:22px 12px 40px}}</style></head><body><div class="wrap"><header><div><h1>🌿 Kaiser's Plant Onboarding Tracker</h1><div class="sub">Quarantine, treatment, acclimation, and release tracking for new plants.</div></div><div class="topactions"><button class="plantdex" onclick="location.href='./?v=onboarding-linked'">← Plantdex</button><button class="primary" id="openAdd">+ Add plant</button><button id="exportBtn">Export backup</button><span id="saveState" class="save">Loading…</span></div></header><section class="stats"><div class="stat"><b id="sTotal">0</b><span>Total</span></div><div class="stat"><b id="sActive">0</b><span>Still onboarding</span></div><div class="stat"><b id="sTreat">0</b><span>Treatment / watch</span></div><div class="stat"><b id="sClear">0</b><span>Ready / cleared</span></div></section><div class="controls"><input id="search" placeholder="Search plants, pests, notes…"><select id="filterStatus"><option value="">All statuses</option><option>Intake</option><option>Observation</option><option>Treating</option><option>Recovery</option><option>Cleared</option></select><select id="filterRisk"><option value="">All risks</option><option>Low</option><option>Medium</option><option>High</option></select><select id="sortBy"><option value="">Original order</option><option value="status">Sort: Status</option><option value="risk">Sort: Risk level</option><option value="release">Sort: Release countdown</option></select><select id="sortDir"><option value="priority">Priority / soonest first</option><option value="reverse">Reverse</option></select></div><div class="tablewrap"><table><thead><tr><th>Photo</th><th>Plant</th><th>Intake</th><th>Status</th><th>Risk</th><th>Protocol</th><th>Symptoms / pests</th><th>Last treatment</th><th>Next check</th><th>Release countdown</th><th>Notes</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div><dialog id="dlg"><form id="form"><h2>Add onboarding plant</h2><div class="grid"><label>Plant name<input name="name" required></label><label>Nickname<input name="nickname"></label><label>Intake<input name="intake" type="date" required></label><label>Status<select name="status"><option>Intake</option><option selected>Observation</option><option>Treating</option><option>Recovery</option><option>Cleared</option></select></label><label>Risk<select name="risk"><option>Low</option><option selected>Medium</option><option>High</option></select></label><label>Price<input name="price"></label><label>Countdown protocol<select name="treatmentProtocol"><option selected>Observation</option><option>Preventive treatment</option><option>Pest treatment</option></select></label><label>Last treatment<input name="lastTreatment" type="date"></label><label class="full">Symptoms / pest concerns<input name="symptoms"></label><label>Next check<input name="nextCheck" type="date"></label><label class="full">Notes<textarea name="notes"></textarea></label></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button type="button" id="cancelBtn">Cancel</button><button class="primary">Add</button></div></form></dialog><script>const API_BASE='https://twemhhiyywhogaxvlnwz.supabase.co/functions/v1/quarantine-tracker';const params=new URLSearchParams(location.search),token=params.get('token')||localStorage.getItem('plantdex_onboarding_token')||'';if(params.get('token'))localStorage.setItem('plantdex_onboarding_token',params.get('token'));const api=API_BASE+'?api=data&token='+encodeURIComponent(token);let plants=[],timer;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function state(t){$('saveState').textContent=t}function protocol(p){return p.treatmentProtocol||((p.status==='Treating'||p.status==='Recovery')?'Pest treatment':'Observation')}function releaseInfo(p){if(p.status==='Cleared')return{kind:'ready',text:'Ready',sub:'Manually cleared',days:-1};const pr=protocol(p);let base=p.intake,span=14;if(pr==='Preventive treatment'){base=p.lastTreatment||p.intake;span=14}if(pr==='Pest treatment'){if(!p.lastTreatment)return{kind:'blocked',text:'—',sub:'Set treatment date',days:99999};base=p.lastTreatment;span=21}if(!base)return{kind:'blocked',text:'—',sub:'Set intake date',days:99999};const target=new Date(base+'T12:00:00');target.setDate(target.getDate()+span);const now=new Date();now.setHours(12,0,0,0);const n=Math.ceil((target-now)/86400000);return n<=0?{kind:'ready',text:'Ready',sub:'Eligible '+target.toLocaleDateString(),days:0}:{kind:'counting',text:n+' day'+(n===1?'':'s'),sub:'Until '+target.toLocaleDateString(),days:n}}async function load(){if(!token){state('Missing access token');return}const r=await fetch(api,{cache:'no-store'});if(!r.ok){state('Unable to load');return}plants=await r.json();render();state('Synced with Plantdex')}function save(){state('Syncing…');clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(plants)});state(r.ok?'Plantdex synced '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Sync failed')}catch{state('Sync failed')}},250)}function badge(v){return '<span class="badge '+String(v).toLowerCase()+'">'+esc(v)+'</span>'}function render(){const q=$('search').value.toLowerCase(),fs=$('filterStatus').value,fr=$('filterRisk').value,sort=$('sortBy').value,dir=$('sortDir').value;let rows=plants.filter(p=>(!q||((p.name||'')+' '+(p.nickname||'')+' '+(p.symptoms||'')+' '+(p.notes||'')).toLowerCase().includes(q))&&(!fs||p.status===fs)&&(!fr||p.risk===fr));if(sort){const statusRank={Treating:0,Recovery:1,Observation:2,Intake:3,Cleared:4},riskRank={High:0,Medium:1,Low:2};rows=[...rows].sort((a,b)=>{if(sort==='release')return releaseInfo(a).days-releaseInfo(b).days||String(a.name||'').localeCompare(String(b.name||''));const rank=sort==='status'?statusRank:riskRank;return((rank[a[sort]]??99)-(rank[b[sort]]??99))||String(a.name||'').localeCompare(String(b.name||''))});if(dir==='reverse')rows.reverse()}$('tbody').innerHTML=rows.map(p=>{const ri=releaseInfo(p),pr=protocol(p);return `<tr data-id="${esc(p.id)}"><td>${p.photo?`<img class="thumb" src="${esc(p.photo)}">`:'<div class="thumb" style="display:grid;place-items:center;color:#718177">no photo</div>'}<label class="small" style="cursor:pointer">Photo<input hidden class="photoInput" type="file" accept="image/*"></label></td><td style="min-width:190px"><input data-k="name" value="${esc(p.name)}"><input data-k="nickname" style="margin-top:5px" placeholder="nickname" value="${esc(p.nickname)}"><input data-k="price" style="margin-top:5px" placeholder="price" value="${esc(p.price)}">${p.plantdexLinked?'<span class="linked">● Linked to Plantdex</span>':''}</td><td><input data-k="intake" type="date" value="${esc(p.intake)}"></td><td>${badge(p.status)}<select data-k="status" style="margin-top:5px">${['Intake','Observation','Treating','Recovery','Cleared'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${badge(p.risk)}<select data-k="risk" style="margin-top:5px">${['Low','Medium','High'].map(x=>`<option ${x===p.risk?'selected':''}>${x}</option>`).join('')}</select></td><td style="min-width:170px"><select data-k="treatmentProtocol">${['Observation','Preventive treatment','Pest treatment'].map(x=>`<option ${x===pr?'selected':''}>${x}</option>`).join('')}</select><div class="small" style="margin-top:5px">${pr==='Pest treatment'?'21 days after last treatment':pr==='Preventive treatment'?'14 days after last treatment':'14 days from intake'}</div></td><td style="min-width:220px"><textarea data-k="symptoms">${esc(p.symptoms)}</textarea></td><td><input data-k="lastTreatment" type="date" value="${esc(p.lastTreatment)}"></td><td><input data-k="nextCheck" type="date" value="${esc(p.nextCheck)}"></td><td style="min-width:145px"><div class="badge ${ri.kind}"><span class="count">${ri.text}</span><small>${esc(ri.sub)}</small></div></td><td style="min-width:250px"><textarea data-k="notes">${esc(p.notes)}</textarea></td><td><button class="danger deleteBtn">Delete</button></td></tr>`}).join('');const ready=plants.filter(p=>releaseInfo(p).kind==='ready').length;$('sTotal').textContent=plants.length;$('sActive').textContent=plants.length-ready;$('sTreat').textContent=plants.filter(p=>['Treating','Observation','Recovery'].includes(p.status)).length;$('sClear').textContent=ready}$('tbody').addEventListener('change',e=>{const el=e.target,tr=el.closest('tr');if(!tr)return;const p=plants.find(x=>x.id===tr.dataset.id);if(!p)return;if(el.classList.contains('photoInput')){const f=el.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{p.photo=rd.result;render();save()};rd.readAsDataURL(f);return}const k=el.dataset.k;if(k){p[k]=el.value;render();save()}});$('tbody').addEventListener('click',e=>{const b=e.target.closest('.deleteBtn');if(!b)return;const tr=b.closest('tr');if(confirm('Remove this onboarding record? The Plantdex plant will remain.')){plants=plants.filter(x=>x.id!==tr.dataset.id);render();save()}});$('openAdd').onclick=()=>{form.reset();form.intake.value=new Date().toISOString().slice(0,10);dlg.showModal()};$('cancelBtn').onclick=()=>dlg.close();$('form').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));plants.push({id:uid(),name:d.name,nickname:d.nickname,intake:d.intake,status:d.status,risk:d.risk,price:d.price,treatmentProtocol:d.treatmentProtocol,symptoms:d.symptoms,lastTreatment:d.lastTreatment,nextCheck:d.nextCheck,notes:d.notes,photo:''});dlg.close();render();save()});['search','filterStatus','filterRisk','sortBy','sortDir'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(plants,null,2)],{type:'application/json'}));a.download='kaisers-plant-onboarding-backup.json';a.click()};load();</script></body></html>
