<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plantdex</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f7f2;color:#183126;display:grid;place-items:center;min-height:100vh}.loading{background:#fff;padding:30px 34px;border-radius:20px;box-shadow:0 14px 34px rgba(32,67,49,.10);text-align:center}.leaf{font-size:2rem}
</style>
</head>
<body>
<div class="loading"><div class="leaf">🌿</div><strong>Loading Plantdex…</strong></div>
<script>
(async()=>{
  try{
    const files=Array.from({length:6},(_,i)=>`chunks/part-${String(i).padStart(2,'0')}.txt`);
    const responses=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'})));
    if(responses.some(r=>!r.ok)) throw new Error('A Plantdex source file could not be loaded.');
    const parts=await Promise.all(responses.map(r=>r.text()));
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML=`<div class="loading"><div class="leaf">⚠️</div><strong>Plantdex could not load.</strong><p>${err.message}</p></div>`;
  }
})();
</script>
</body>
</html>
