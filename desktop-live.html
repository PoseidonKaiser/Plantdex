<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaiser's Plant Collection</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0b120e;color:#e8f2eb;display:grid;place-items:center;min-height:100vh}.loading{width:min(520px,calc(100% - 40px));background:#141d17;padding:28px 32px;border:1px solid #2b3a31;border-radius:20px;box-shadow:0 14px 34px rgba(0,0,0,.34);text-align:center}.leaf{font-size:2rem}.status{margin-top:10px;color:#a6b7ac}.error{color:#ffaaaa;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="loading"><div class="leaf">🌿</div><strong>Loading Kaiser's Plant Collection…</strong><div class="status" id="bootStatus">Starting desktop loader…</div></div>
<script>
(async()=>{
 const status=m=>{const e=document.getElementById('bootStatus');if(e)e.textContent=m;};
 const rawBase='https://raw.githubusercontent.com/PoseidonKaiser/Plantdex/main/';
 async function fetchText(path,label){
  status(label);
  const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),5000);
  try{const r=await fetch(path+'?boot=20260828b',{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}
  catch(e){status(label+' · using fallback…');const r=await fetch(rawBase+path+'?boot=20260828b',{cache:'no-store'});if(!r.ok)throw new Error(label+' failed ('+r.status+')');return await r.text();}
  finally{clearTimeout(timer);}
 }
 try{
  const files=Array.from({length:6},(_,i)=>`chunks/part-${String(i).padStart(2,'0')}.txt`);
  const parts=[]; for(let i=0;i<files.length;i++)parts.push(await fetchText(files[i],`Loading app ${i+1} of ${files.length}…`));
  status('Preparing collection…');
  let html=parts.join('');
  if(!html.includes('</html>'))throw new Error('App shell is incomplete.');
  html=html.replace(/plantCollectionTracker_profiles_v7/g,'plantCollectionTracker_profiles_v8');
  html=html.replace('<title>My Plant Collection Tracker</title>',"<title>Kaiser's Plant Collection</title>");
  html=html.replace('<h1>🌿 My Plant Collection</h1>',"<h1>🌿 Kaiser's Plant Collection</h1>");
  const authBar='<div class="cloudbar" id="cloudBar"><input id="cloudEmail" type="email" autocomplete="email" placeholder="Email"><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="Password"><button class="primary" id="cloudSignIn" type="button">Sign in</button><button class="secondary" id="cloudSignUp" type="button">Create account</button><button class="primary" id="cloudSetPassword" type="button" style="display:none">Set new password</button><button class="cloud-forgot" id="cloudForgot" type="button">Forgot password?</button><button class="secondary" id="cloudLogout" type="button" style="display:none">Sign out</button><span class="cloudstatus" id="cloudStatus">Loading cloud sync…</span></div>';
  html=html.replace('</style>','.cloudbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;background:#eef6ef;border:1px solid var(--line);border-radius:14px}.cloudbar input{max-width:240px}.cloudstatus{font-size:.85rem;color:var(--muted);font-weight:700}.cloud-forgot{background:transparent;border:0;color:var(--green);padding:7px 8px;font-size:.85rem}</style>');
  html=html.replace('<section class="stats">',authBar+'\n<section class="stats">');
  const scripts='<scr'+'ipt src="plantdex-runtime-guard.js?v=20260828-desktoplive2"></scr'+'ipt><scr'+'ipt src="plantdex-cloud-v2.js?v=20260828-mobile-savefix1"></scr'+'ipt><scr'+'ipt src="plantdex-pedigree.js?v=20260828-pedigree1"></scr'+'ipt><scr'+'ipt src="plantdex-reconcile.js?v=0820-darkfix-1"></scr'+'ipt>';
  html=html.replace('</body>',scripts+'\n</body>');
  status('Opening collection…');
  setTimeout(()=>{document.open();document.write(html);document.close();},0);
 }catch(err){const box=document.querySelector('.loading');if(box)box.innerHTML='<div class="leaf">⚠️</div><strong>Desktop PlantDex could not load.</strong><div class="status error">'+String(err&&err.message||err)+'</div>';}
})();
</script>
</body>
</html>
