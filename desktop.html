<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlantDex Desktop Refresh</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b120e;color:#e8f2eb;font-family:system-ui,-apple-system,sans-serif}
.card{width:min(520px,calc(100% - 32px));background:#141d17;border:1px solid #2b3a31;border-radius:20px;padding:28px;box-shadow:0 16px 38px rgba(0,0,0,.34)}
strong{font-size:1.2rem}.status{margin-top:10px;color:#b7c7bc;line-height:1.5}.leaf{font-size:2rem;margin-bottom:8px}
</style>
</head>
<body>
<div class="card"><div class="leaf">🌿</div><strong>Refreshing PlantDex desktop…</strong><div class="status" id="status">Connecting to your cloud library.</div></div>
<script>
(async()=>{
const SB_URL='https://twemhhiyywhogaxvlnwz.supabase.co';
const SB_KEY='sb_publishable_gQz5LPJE-4XZHaGvUNbggA_7EkMRVOn';
const AUTH_KEY='sb-twemhhiyywhogaxvlnwz-auth-token';
const LOCAL_KEY='plantCollectionTracker_profiles_v8';
const status=document.getElementById('status');
function token(){
  try{
    const raw=localStorage.getItem(AUTH_KEY); if(!raw)return '';
    const p=JSON.parse(raw);
    return p?.access_token||p?.currentSession?.access_token||p?.session?.access_token||'';
  }catch(e){return '';}
}
function headers(t,extra={}){return Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+t},extra);}
async function sign(t,path){
  if(!path)return '';
  const encoded=String(path).split('/').map(encodeURIComponent).join('/');
  const r=await fetch(SB_URL+'/storage/v1/object/sign/plantdex-photos/'+encoded,{method:'POST',headers:headers(t,{'Content-Type':'application/json'}),body:JSON.stringify({expiresIn:604800}),cache:'no-store'});
  if(!r.ok)return '';
  const d=await r.json();
  const s=d.signedURL||d.signedUrl||'';
  return s?(s.startsWith('http')?s:SB_URL+'/storage/v1'+s)+(s.includes('?')?'&':'?')+'pd='+Date.now():'';
}
async function hydrate(t,node,paths){
  if(typeof paths==='string'&&paths)return await sign(t,paths);
  if(Array.isArray(node)){
    const out=[];for(let i=0;i<node.length;i++)out.push(await hydrate(t,node[i],Array.isArray(paths)?paths[i]:null));return out;
  }
  if(node&&typeof node==='object'){
    const out={};for(const [k,v] of Object.entries(node))out[k]=await hydrate(t,v,paths&&typeof paths==='object'?paths[k]:null);return out;
  }
  return node;
}
const t=token();
if(!t){
  status.textContent='Your desktop session needs to sign in once. Opening PlantDex now…';
  setTimeout(()=>location.replace('./?desktop=1&v=20260828'),900);return;
}
try{
  status.textContent='Downloading the latest collection…';
  const r=await fetch(SB_URL+'/rest/v1/plantdex_plants?select=local_id,data,photo_path&order=created_at.asc',{headers:headers(t),cache:'no-store'});
  if(!r.ok)throw new Error('Cloud read failed ('+r.status+')');
  const rows=await r.json();
  const plants=[];
  let photos=0;
  for(const row of rows){
    const p=Object.assign({},row.data||{},{id:String(row.local_id)});
    p.photoPath=row.photo_path||p.photoPath||'';
    if(p.photoPath){p.photo=await sign(t,p.photoPath);if(p.photo)photos++;}else p.photo='';
    p.gallery=await hydrate(t,Array.isArray(p.gallery)?p.gallery:[],p.galleryCloudPaths||[]);
    plants.push(p);
    status.textContent='Refreshing '+plants.length+' of '+rows.length+' plants…';
  }
  localStorage.setItem(LOCAL_KEY,JSON.stringify(plants));
  status.textContent='Loaded '+plants.length+' plants and '+photos+' profile photos. Opening PlantDex…';
  setTimeout(()=>location.replace('./?desktop=1&v=20260828-cloudfix'),700);
}catch(e){
  console.error(e);
  status.textContent='Could not refresh the desktop library. Opening PlantDex so you can sign in again.';
  setTimeout(()=>location.replace('./?desktop=1&v=20260828-cloudfix'),1400);
}
})();
</script>
</body>
</html>
