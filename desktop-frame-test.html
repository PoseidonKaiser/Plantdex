<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaiser's Plant Collection</title><style>html,body{margin:0;width:100%;height:100%;background:#0b120e;overflow:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;color:#e8f2eb;font:600 18px system-ui;background:#0b120e;z-index:2}#bootbox{padding:26px 30px;border:1px solid #2b3a31;border-radius:20px;background:#141d17;text-align:center}#bootstatus{margin-top:8px;color:#a6b7ac;font-weight:400}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b120e}</style></head><body><div id="boot"><div id="bootbox">🌿 Loading Kaiser's Plant Collection…<div id="bootstatus">Starting…</div></div></div><iframe id="app" title="Kaiser's Plant Collection"></iframe><script>(async()=>{const status=m=>document.getElementById('bootstatus').textContent=m;try{const files=Array.from({length:6},(_,i)=>`chunks/part-${String(i).padStart(2,'0')}.txt`);const parts=[];for(let i=0;i<files.length;i++){status(`Loading app ${i+1} of 6…`);const r=await fetch(files[i]+'?v=desktopframe1',{cache:'no-store'});if(!r.ok)throw new Error('Could not load '+files[i]);parts.push(await r.text());}status('Preparing collection…');let html=parts.join('');html=html.replace(/plantCollectionTracker_profiles_v7/g,'plantCollectionTracker_profiles_v8');html=html.replace('<title>My Plant Collection Tracker</title>',"<title>Kaiser's Plant Collection</title>");html=html.replace('<h1>🌿 My Plant Collection</h1>',"<h1>🌿 Kaiser's Plant Collection</h1>");const auth='<div class="cloudbar" id="cloudBar"><input id="cloudEmail" type="email" autocomplete="email" placeholder="Email"><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="Password"><button class="primary" id="cloudSignIn" type="button">Sign in</button><button class="secondary" id="cloudSignUp" type="button">Create account</button><button class="primary" id="cloudSetPassword" type="button" style="display:none">Set new password</button><button class="cloud-forgot" id="cloudForgot" type="button">Forgot password?</button><button class="secondary" id="cloudLogout" type="button" style="display:none">Sign out</button><span class="cloudstatus" id="cloudStatus">Loading cloud sync…</span></div>';html=html.replace('</style>','.cloudbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;background:#eef6ef;border:1px solid var(--line);border-radius:14px}.cloudbar input{max-width:240px}.cloudstatus{font-size:.85rem;color:var(--muted);font-weight:700}.cloud-forgot{background:transparent;border:0;color:var(--green);padding:7px 8px;font-size:.85rem}</style>');html=html.replace('<section class="stats">',auth+'<section class="stats">');const scripts='<scr'+'ipt src="plantdex-runtime-guard.js?v=desktopframe1"></scr'+'ipt><scr'+'ipt src="plantdex-cloud-v2.js?v=20260828-mobile-savefix1"></scr'+'ipt><scr'+'ipt src="plantdex-pedigree.js?v=20260828-pedigree1"></scr'+'ipt><scr'+'ipt src="plantdex-reconcile.js?v=0820-darkfix-1"></scr'+'ipt>';html=html.replace('</body>',scripts+'</body>');const frame=document.getElementById('app');frame.addEventListener('load',()=>{document.getElementById('boot').style.display='none';},{once:true});frame.srcdoc=html;setTimeout(()=>{document.getElementById('boot').style.display='none';},8000);}catch(e){document.getElementById('bootbox').innerHTML='⚠️ Desktop PlantDex could not load.<div id="bootstatus">'+String(e.message||e)+'</div>';}})();</script></body></html>
