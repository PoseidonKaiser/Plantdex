name: Test & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'appscript/**'
  pull_request:
    branches: [main]
    paths:
      - 'appscript/**'
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: appscript/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: appscript

      - name: Run tests
        run: npm test
        working-directory: appscript

  deploy:
    name: Deploy to Apps Script
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2

      - name: Restore clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force
        working-directory: appscript

      - name: Create version and deploy
        working-directory: appscript
        run: |
          VERSION_OUTPUT=$(clasp version "ci-${GITHUB_SHA::7}")
          echo "$VERSION_OUTPUT"
          VERSION_NUM=$(echo "$VERSION_OUTPUT" | grep -oP 'Created version \K\d+')
          clasp deploy -V "$VERSION_NUM" -d "ci-${GITHUB_SHA::7}" -i "${{ secrets.CLASP_DEPLOYMENT_ID }}"
