<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plantdex</title>
  <meta name="description" content="A plant collection tracker">
  <meta name="theme-color" content="#2d5a3d">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plantdex">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #f4f7f2;
      font-family: system-ui, -apple-system, sans-serif;
      color: #2d5a3d;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .leaf { font-size: 3rem; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    p { font-size: .95rem; color: #5a7a65; }
  </style>
</head>
<body>
  <div class="leaf">🌿</div>
  <p>Opening Plantdex…</p>

  <script>
    var BASE = 'https://script.google.com/macros/s/AKfycbwheFuxTlMMxKgwlTR95Ve7a8pBGexjBhW6GE4e3tA62-3MTrWb6bBt9MbkerRHJyMO5g/exec';
    var params = new URLSearchParams(window.location.search);
    var plantId = params.get('plantId');
    var target = plantId ? BASE + '?plantId=' + encodeURIComponent(plantId) : BASE;
    window.location.replace(target);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(err) {
        console.warn('SW registration failed:', err);
      });
    }
  </script>
</body>
</html>
